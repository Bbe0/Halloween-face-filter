<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween Face FX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Courier+Prime:wght@400;700&family=Fredoka:wght@600;700&family=Pacifico&display=swap">
<style>
  /* Layout: one camera stage, two quiet label rows underneath. Single light look by choice. */
  :root{
    --bg:#f3f2f0;
    --ink:#1c1b1d;
    --mute:#8d8a8e;
    --line:#e1dfdc;
    --stage:#e8e6e3;
    --card:#ffffff;
    --red:#cf1422;
    --sans:"Figtree", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;
    display:flex;flex-direction:column;gap:10px;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .name{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
  .status{color:var(--mute);font-size:12px;text-align:right}
  .status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-right:7px;vertical-align:1px}
  .status.live i{background:var(--red)}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .frame{position:relative;width:100%;height:100%;flex:none;border-radius:18px;overflow:hidden;background:var(--stage)}
  canvas#cv{display:block;width:100%;height:100%;object-fit:contain}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:20px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .flash.on{opacity:.85;transition:none}

  .panel{position:absolute;left:12px;bottom:12px;width:min(270px, calc(100% - 24px));background:rgba(255,255,255,.94);border-radius:14px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 6px 24px rgba(30,25,30,.12)}
  .panel .row{display:grid;grid-template-columns:72px 1fr 34px;align-items:center;gap:10px}
  .panel label{color:var(--ink)}
  .panel output{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
  .panel input[type=range]{width:100%;accent-color:var(--ink)}
  .panel .foot{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px}
  .panel .acts{display:flex;gap:14px}
  .panel .foot button{border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}

  .rows{display:grid;gap:6px}
  nav{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-width:0}
  nav::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:none;font:inherit;color:var(--mute);padding:8px 11px;border-radius:999px;cursor:pointer;position:relative;transition:color .15s, background .15s}
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{color:var(--ink);background:var(--card)}
  .fx[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
  .sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 6px}
  .chip:focus-visible,.shot:focus-visible,.txt input:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar nav{flex:1}
  .bar nav#bgNav{flex:none}
  .txt{flex:none;display:flex;align-items:center;gap:8px;color:var(--mute)}
  .txt input{width:9.5em;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:7px 12px;border-radius:999px;outline:none}
  .txt input.wide{width:15em}
  .txt input[type=range]{width:8em;padding:0;border:0;background:none;accent-color:var(--ink)}
  .shot{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer;margin-left:auto}
  .shot:hover{border-color:var(--ink)}
  .shot:disabled{opacity:.4;cursor:default}
  .shutter{display:none}
  @media (max-width:640px), (pointer:coarse){
    html,body{height:100dvh}
    body{gap:8px;padding-top:max(10px, env(safe-area-inset-top));padding-bottom:max(10px, env(safe-area-inset-bottom))}
    .frame{border-radius:14px}
    .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}
    .bar::-webkit-scrollbar{display:none}
    .bar nav{flex:none;overflow:visible}
    .chip{padding:9px 12px}
    .txt{flex:none}.txt input,.txt input.wide{width:12em}
    .shot{display:none}
    .shutter{display:flex;position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:68px;height:68px;border-radius:50%;
      border:4px solid rgba(255,255,255,.95);background:rgba(255,255,255,.28);align-items:center;justify-content:center;color:#fff;font:600 11px var(--sans);cursor:pointer;
      box-shadow:0 2px 12px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent}
    .shutter:active{background:rgba(255,255,255,.55)}
    .shutter:disabled{opacity:.4}
    .panel{bottom:96px}
  }
  @media (prefers-reduced-motion:reduce){.flash{transition:none}}
</style>
</head>
<body>
<header>
  <div class="name">Halloween Face FX</div>
  <div class="status" id="status"><i></i><span>Starting camera</span></div>
</header>
<div class="stage">
  <div class="frame" id="frame">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">Allow camera access to begin</div>
    <div class="flash" id="flash"></div>
    <div class="panel" id="panel" hidden>
      <div class="row"><label for="b-slim">Slim</label><input id="b-slim" type="range" min="0" max="100" value="0"><output id="o-slim">0</output></div>
      <div class="row"><label for="b-narrow">Narrow</label><input id="b-narrow" type="range" min="0" max="100" value="0"><output id="o-narrow">0</output></div>
      <div class="row"><label for="b-short">Short face</label><input id="b-short" type="range" min="0" max="100" value="0"><output id="o-short">0</output></div>
      <div class="row"><label for="b-eye">Eye length</label><input id="b-eye" type="range" min="-100" max="100" value="0"><output id="o-eye">0</output></div>
      <div class="row"><label for="b-nose">Nose</label><input id="b-nose" type="range" min="-100" max="100" value="0"><output id="o-nose">0</output></div>
      <div class="row"><label for="b-mouth">Mouth</label><input id="b-mouth" type="range" min="-100" max="100" value="0"><output id="o-mouth">0</output></div>
      <div class="foot"><span id="beautyNote">Works with every filter</span><span class="acts"><button id="b-reset" type="button">Reset</button><button id="b-close" type="button">Close</button></span></div>
    </div>
  </div>
  <button class="shutter" id="shutter" aria-label="Capture" disabled><span id="shutterLabel"></span></button>
</div>
<div class="rows">
  <div class="bar"><nav id="nav" aria-label="Filters"></nav></div>
  <div class="bar">
    <nav id="lens" aria-label="Camera"></nav>
    <span class="sep" id="lensSep"></span>
    <button class="chip" id="tone-bw" aria-pressed="true">B&amp;W</button>
    <button class="chip" id="tone-color" aria-pressed="false">Color</button>
    <span class="sep"></span>
    <button class="chip" id="flipBtn" hidden>Flip camera</button>
    <button class="chip" id="beautyBtn" aria-pressed="false">Beauty</button>
    <button class="chip" id="mosaicBtn" aria-pressed="false">Hand Mosaic</button>
    <label class="txt" id="hbdWrap" hidden><span>Text</span><input id="hbdText" type="text" value="HBD" maxlength="14" spellcheck="false" autocomplete="off"></label>
    <label class="txt" id="wallWrap" hidden><span>Text</span><input id="wallText" class="wide" type="text" value="TRICK / OR / TREAT!" maxlength="48" spellcheck="false" autocomplete="off" placeholder="Use / for a new line"></label>
    <nav id="bgNav" aria-label="Strip background" hidden></nav>
    <label class="txt" id="brightWrap" hidden><span>Brightness</span><input id="boothBright" type="range" min="-40" max="40" value="10"></label>
    <button class="chip" id="retake" hidden>Retake all</button>
    <button class="shot" id="shot" disabled>Capture</button>
  </div>
</div>
<video id="vid" playsinline muted hidden></video>

<script type="module">
import {FaceLandmarker, HandLandmarker, ImageSegmenter, ObjectDetector, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const CDN="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL={
  face:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  hand:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
  seg:"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
  pet:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite"
};

/* ======================= STATE & UI ======================= */
const FILTERS=[["none","None"],["ghosts","Ghosts"],["bleed","Bleeding"],["cross","Cross"],["spider","Spider"],["devil","Devil"],
  ["birthday","Birthday"],["crybaby","Crybaby"],["wall","Sewn Wall"]];
const LENSES=[["normal","Normal"],["booth","Photobooth"],["locked","Locked"],["pixel","Pixel Pal"]];
const HINT={bleed:"Blink to bleed",ghosts:"Ghosts · point and hold to add one",wall:"Sewn Wall"};
const S={filter:"ghosts",lens:"normal",mosaic:false,bw:true,beauty:{slim:0,narrow:0,short:0,eye:0,nose:0,mouth:0}};
let fxStart=performance.now();

const $=id=>document.getElementById(id);
const nav=$("nav"), lensNav=$("lens");
FILTERS.forEach(([id,label])=>{const b=document.createElement("button");b.className="chip fx";b.id="fx-"+id;b.textContent=label;
  b.setAttribute("aria-pressed",id===S.filter);b.onclick=()=>pickFilter(id);nav.appendChild(b)});
setTimeout(()=>BG_LIST.forEach(([id,label])=>{const b=document.createElement("button");b.className="chip";b.id="bg-"+id;b.textContent=label;
  b.setAttribute("aria-pressed",id===BOOTH.bg);b.onclick=()=>{BOOTH.bg=id;$("bgNav").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.id==="bg-"+id));sizeOut()};$("bgNav").appendChild(b)}),0);
LENSES.forEach(([id,label])=>{const b=document.createElement("button");b.className="chip";b.id="ln-"+id;b.textContent=label;
  b.setAttribute("aria-pressed",id===S.lens);b.onclick=()=>pickLens(id);lensNav.appendChild(b)});
function pickFilter(id){
  S.filter=id; fxStart=performance.now(); DRIPS.length=0; TEARS.drops.length=0; FG.list.length=0; FG.dwell=null; FG.last=null;
  nav.querySelectorAll(".fx").forEach(b=>b.setAttribute("aria-pressed",b.id==="fx-"+id));
  $("hbdWrap").hidden=id!=="birthday"; $("wallWrap").hidden=id!=="wall";
  $("fx-"+id).scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  if(needsSeg()) loadSeg();
  if(id==="ghosts") loadHand();
}
function pickLens(id){
  S.lens=id; lensNav.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.id==="ln-"+id));
  BOOTH.reset(); LOCK.reset(); sizeOut(); boothUI();
  cv.style.cursor=id==="booth"?"pointer":"";
}
const showPanel=on=>{$("panel").hidden=!on;$("beautyBtn").setAttribute("aria-pressed",on)};
$("beautyBtn").onclick=()=>showPanel($("panel").hidden);
$("b-close").onclick=()=>showPanel(false);
const setTone=bw=>{S.bw=bw;$("tone-bw").setAttribute("aria-pressed",bw);$("tone-color").setAttribute("aria-pressed",!bw)};
$("tone-bw").onclick=()=>setTone(true); $("tone-color").onclick=()=>setTone(false);
$("mosaicBtn").onclick=()=>{S.mosaic=!S.mosaic;$("mosaicBtn").setAttribute("aria-pressed",S.mosaic);if(S.mosaic)loadHand()};
const BKEYS=["slim","narrow","short","eye","nose","mouth"];
BKEYS.forEach(k=>{$("b-"+k).addEventListener("input",e=>{S.beauty[k]=e.target.value/100;$("o-"+k).textContent=e.target.value})});
$("b-reset").onclick=()=>BKEYS.forEach(k=>{$("b-"+k).value=0;S.beauty[k]=0;$("o-"+k).textContent="0"});
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const i=FILTERS.findIndex(f=>f[0]===S.filter);
  if(e.key==="ArrowRight") pickFilter(FILTERS[(i+1)%FILTERS.length][0]);
  if(e.key==="ArrowLeft") pickFilter(FILTERS[(i-1+FILTERS.length)%FILTERS.length][0]);
  if(e.key===" "){e.preventDefault();capture()}
});
const statusEl=$("status"), hint=$("hint");
const setStatus=(t,live)=>{const s=statusEl.querySelector("span");if(s.textContent!==t)s.textContent=t;statusEl.classList.toggle("live",!!live)};

/* ======================= CANVASES ======================= */
const vid=$("vid"), cv=$("cv"), out=cv.getContext("2d");
const mk=(w,h)=>{const c=document.createElement("canvas");c.width=w||1;c.height=h||1;return c};
const base=mk(), bctx=base.getContext("2d");
const scene=mk(), ctx=scene.getContext("2d");
const tmp=mk(), tctx=tmp.getContext("2d");
let W=1280,H=720, P=null, F=null, lastSeen=0, lastVT=-1, BS=null;
const models={face:null,hand:null,seg:null,pet:null}, loading={};
let fileset=null;

function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
const MOBILE=matchMedia("(pointer:coarse)").matches||Math.min(screen.width,screen.height)<700;
let MIR=true, FACING="user";
const MX=nx=>MIR?W-nx*W:nx*W;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ======================= FACE FRAME ======================= */
function buildFrame(){
  const eL=P[473], eR=P[468]; const dx=eR.x-eL.x, dy=eR.y-eL.y, s=Math.hypot(dx,dy);
  F={ox:(eL.x+eR.x)/2, oy:(eL.y+eR.y)/2, ax:dx/s, ay:dy/s, bx:-dy/s, by:dx/s, s};
}
const L=i=>{const p=P[i],qx=p.x-F.ox,qy=p.y-F.oy;return {u:(qx*F.ax+qy*F.ay)/F.s, v:(qx*F.bx+qy*F.by)/F.s}};
function local(c=ctx,off=0){c.setTransform(F.ax*F.s,F.ay*F.s,F.bx*F.s,F.by*F.s,F.ox-off,F.oy)}
function screen(c=ctx){c.setTransform(1,0,0,1,0,0)}
const polyL=ids=>ids.map(L);
const OFF=20000;
function soft(pathFn,color,blurPx,alpha=1,rule="nonzero"){
  ctx.save(); ctx.globalAlpha=alpha; local(ctx,OFF); ctx.beginPath(); pathFn(ctx);
  ctx.shadowColor=color; ctx.shadowBlur=blurPx; ctx.shadowOffsetX=OFF; ctx.fillStyle=color; ctx.fill(rule); ctx.restore();
}
function shape(pts,c){c.moveTo(pts[0].u,pts[0].v);for(let i=1;i<pts.length;i++)c.lineTo(pts[i].u,pts[i].v);c.closePath()}
const EYE_SL=[263,466,388,387,386,385,384,398,362,382,381,380,374,373,390,249];
const EYE_SR=[33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const LOW_SL=[263,249,390,373,374,380,381,382,362];
const LOW_SR=[33,7,163,144,145,153,154,155,133];
function lidPoint(ids,frac){const q=polyL(ids),f=frac*(q.length-1),i=Math.min(q.length-2,Math.floor(f)),k=f-i;
  return {u:q[i].u+(q[i+1].u-q[i].u)*k, v:q[i].v+(q[i+1].v-q[i].v)*k}}
function restoreEye(ids,grow=1){
  const pts=ids.map(i=>P[i]);let cx=0,cy=0;pts.forEach(p=>{cx+=p.x;cy+=p.y});cx/=pts.length;cy/=pts.length;
  ctx.save();screen();ctx.beginPath();pts.forEach((p,i)=>{const x=cx+(p.x-cx)*grow,y=cy+(p.y-cy)*grow;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.closePath();ctx.clip();ctx.drawImage(base,0,0);ctx.restore();
}

/* ======================= FILTERS ======================= */

/* Ghosts — airbrushed ghosts floating beside the face */
function ghostPath(x,y,sz,rot,flip){
  return c=>{c.translate(x,y);c.rotate(rot);c.scale(sz*flip,sz);
    c.moveTo(-.48,0);c.arc(0,-.05,.48,Math.PI,0);
    c.bezierCurveTo(.5,.35,.42,.62,.62,.98);c.quadraticCurveTo(.3,.86,.16,.8);
    c.quadraticCurveTo(.02,.92,-.12,.74);c.quadraticCurveTo(-.3,.8,-.36,.6);c.quadraticCurveTo(-.5,.42,-.48,0);c.closePath()};
}
function ghostFace(x,y,sz,rot,flip){
  return c=>{c.translate(x,y);c.rotate(rot);c.scale(sz*flip,sz);
    c.ellipse(-.16,-.12,.06,.095,0,0,7);c.moveTo(.2,-.15);c.ellipse(.14,-.15,.06,.095,0,0,7);
    c.moveTo(.06,.2);c.ellipse(-.02,.2,.08,.12,0,0,7)};
}
function fxGhosts(t,A){
  const l=A.le, r=A.re;
  const G=[[l.u-.42,l.v-.75,.36,-.22,1,0],[l.u-.6,l.v+.2,.28,-.08,1,1.7],[r.u+.48,r.v-.45,.32,.2,-1,3.1],[r.u+.36,r.v+.5,.24,.1,-1,4.4]];
  for(const [x,y,sz,rot,fl,ph] of G){
    const yy=y+Math.sin(t/700+ph)*.06, rr=rot+Math.sin(t/900+ph)*.06;
    const p=ghostPath(x,yy,sz,rr,fl);
    soft(p,"rgba(255,255,255,1)",F.s*sz*.4,.4);
    soft(p,"rgba(255,255,255,1)",F.s*sz*.08,.92);
    ctx.save(); ctx.globalCompositeOperation="multiply";
    soft(ghostFace(x,yy,sz,rr,fl),"rgba(25,22,26,1)",F.s*sz*.05,.9);
    ctx.restore();
  }
}

/* Bleeding — each blink starts a new painted drip, alternating eyes */
const DRIPS=[]; let nextSide=0;
function spawnDrip(t,fc){
  fc=fc||FACES[0]; if(!fc) return; const r=Math.random, nextSide=fc.nextSide; fc.nextSide^=1;
  DRIPS.push({fid:fc.id,side:nextSide,frac:.2+r()*.6,len:.35+r()*.75,w:.028+r()*.022,seed:Math.floor(r()*90)+1,sway:.01+r()*.03,t0:t});
  if(DRIPS.length>24) DRIPS.shift();
}
function dripPts(sx,sy,len,w0,seed,sway,g){
  const N=30,left=[],right=[],n=Math.max(2,Math.round(N*g));
  for(let i=0;i<=n;i++){const k=i/N,v=sy+k*len,u=sx+Math.sin(k*2.4+seed)*sway-k*.05;
    const w=w0*(1-k*.45)*(.75+.5*Math.abs(Math.sin(k*9+seed)));left.push([u-w,v]);right.push([u+w*.8,v])}
  const e=left[left.length-1],f=right[right.length-1];
  return c=>{c.moveTo(...left[0]);left.forEach(p=>c.lineTo(...p));
    c.quadraticCurveTo((e[0]+f[0])/2,e[1]+w0*1.8,f[0],f[1]);right.slice().reverse().forEach(p=>c.lineTo(...p));c.closePath()};
}
function fxBleed(t){
  ctx.save(); ctx.globalCompositeOperation="multiply";
  const smudge=ids=>{const q=polyL(ids);soft(c=>{c.moveTo(q[0].u,q[0].v);q.forEach(p=>c.lineTo(p.u,p.v+.07));q.slice().reverse().forEach(p=>c.lineTo(p.u,p.v+.01))},"rgba(70,35,45,1)",F.s*.06,.38)};
  smudge(LOW_SL); smudge(LOW_SR);
  const rim=ids=>{const q=polyL(ids);soft(c=>{c.moveTo(q[0].u,q[0].v);q.forEach(p=>c.lineTo(p.u,p.v+.03));q.slice().reverse().forEach(p=>c.lineTo(p.u,p.v))},"rgba(170,20,30,1)",F.s*.02,.55)};
  rim(LOW_SL); rim(LOW_SR);
  for(let i=DRIPS.length-1;i>=0;i--){
    const d=DRIPS[i], age=t-d.t0, fade=age>7000?1-(age-7000)/2000:1;
    if(fade<=0){DRIPS.splice(i,1);continue}
    if(CUR&&d.fid!==CUR.id) continue;
    const g=Math.min(1,age/1400), a=lidPoint(d.side?LOW_SR:LOW_SL,d.frac);
    const p=dripPts(a.u,a.v+.015,d.len,d.w,d.seed,d.sway,g);
    soft(p,"rgba(170,30,38,1)",F.s*.06,.45*fade);
    soft(p,"rgba(165,22,32,1)",F.s*.014,.95*fade);
    soft(p,"rgba(120,10,18,1)",F.s*.006,.45*fade);
    const r=rng(d.seed*7);
    for(let j=0;j<6;j++){const k=r()*g*.95,u=a.u+Math.sin(k*2.4+d.seed)*d.sway-k*.05+(r()-.5)*d.w,v=a.v+k*d.len;
      soft(c=>c.ellipse(u,v,d.w*(.3+r()*.3),d.w*(.4+r()*.5),r()*3,0,7),"rgba(90,6,12,1)",F.s*.012,.25*fade)}
  }
  ctx.restore();
}

/* Cross — black smoky cross over one eye, studded with silver */
function stud(x,y,r){const g=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.05,x,y,r);
  g.addColorStop(0,"#ffffff");g.addColorStop(.4,"#c9c8c6");g.addColorStop(1,"#55534f");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function fxCross(){
  const e=L(473),cx=e.u-.02,cy=e.v-.03,k=1.2;
  const vbar=c=>c.rect(cx-.11*k,cy-.52*k,.22*k,1.34*k), hbar=c=>c.rect(cx-.4*k,cy-.09*k,.82*k,.18*k);
  const vb2=c=>c.rect(cx-.08*k,cy-.46*k,.16*k,1.22*k), hb2=c=>c.rect(cx-.34*k,cy-.07*k,.7*k,.14*k);
  ctx.save(); ctx.globalCompositeOperation="multiply";
  soft(c=>{vbar(c);hbar(c)},"rgba(40,30,34,1)",F.s*.16*k,.5);
  soft(c=>{vb2(c);hb2(c)},"rgba(18,14,16,1)",F.s*.08*k,.6);
  soft(c=>{vb2(c);hb2(c)},"rgba(10,8,10,1)",F.s*.05*k,.35);
  ctx.restore();
  restoreEye(EYE_SL,1);
  ctx.save(); local(); ctx.globalAlpha=.5; ctx.globalCompositeOperation="multiply";
  ctx.strokeStyle="#151214"; ctx.lineWidth=.03; ctx.beginPath(); shape(polyL(EYE_SL),ctx); ctx.stroke(); ctx.restore();
  ctx.save(); local(); const r=.019, st=.15*k;
  for(let v=cy-.42*k;v<=cy+.72*k;v+=st){if(Math.abs(v-cy)<.16*k)continue;stud(cx-.075*k,v,r);stud(cx+.075*k,v+.05*k,r)}
  for(let u=cx-.32*k;u<=cx+.34*k;u+=st){if(Math.abs(u-cx)<.16*k)continue;stud(u,cy-.065*k,r);stud(u+.05*k,cy+.065*k,r)}
  ctx.restore();
}

/* Spider — the eye becomes a spider: angular liner legs plus rows of crystals */
function crystal(x,y,r){
  const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.05,x,y,r);
  g.addColorStop(0,"#ffffff");g.addColorStop(.45,"#d9dbe0");g.addColorStop(1,"#7d8088");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.95)";ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.28,0,7);ctx.fill();
}
const SPIDER_LEGS=[ // knee-bent legs around the right-hand eye, in face units from the iris; last flag = crystal row
  [[-.1,-.07],[-.24,-.36],[-.17,-.7],1],[[-.02,-.09],[-.06,-.42],[.06,-.66],0],[[.1,-.08],[.26,-.4],[.46,-.56],1],[[.17,-.05],[.45,-.25],[.6,-.05],1],
  [[-.17,-.01],[-.38,0],[-.54,.05],0],[[-.08,.07],[-.22,.4],[-.15,.68],1],[[.04,.09],[.1,.46],[.24,.72],0],[[.15,.06],[.38,.33],[.44,.64],1]];
function spiderLeg(E,leg){return leg.slice(0,3).map(([u,v])=>({u:E.u+u,v:E.v+v}))}
function taper(c,pts,w0){
  const L1=[],R1=[],N=pts.length;
  for(let i=0;i<N;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(N-1,i+1)],dx=b.u-a.u,dy=b.v-a.v,n=Math.hypot(dx,dy)||1,w=w0*(1-i/(N-1))+.002;
    L1.push([pts[i].u-dy/n*w,pts[i].v+dx/n*w]);R1.push([pts[i].u+dy/n*w,pts[i].v-dx/n*w])}
  c.moveTo(...L1[0]);L1.forEach(p=>c.lineTo(...p));R1.reverse().forEach(p=>c.lineTo(...p));c.closePath();
}
const lerpP=(a,b,k)=>({u:a.u+(b.u-a.u)*k,v:a.v+(b.v-a.v)*k});
function legPolyline(seg){const out=[];for(let i=0;i<=6;i++)out.push(lerpP(seg[0],seg[1],i/6));for(let i=1;i<=8;i++)out.push(lerpP(seg[1],seg[2],i/8));return out}
function fxSpider(){
  const E=L(468), legs=SPIDER_LEGS.map(l=>legPolyline(spiderLeg(E,l)));
  const lid=polyL(EYE_SR);
  const draw=c=>{legs.forEach(pl=>taper(c,pl,.03));c.moveTo(lid[0].u,lid[0].v);lid.forEach(p=>c.lineTo(p.u,p.v-.012));c.closePath()};
  ctx.save(); ctx.globalCompositeOperation="multiply";
  soft(draw,"rgba(30,22,26,1)",F.s*.05,.35);
  soft(draw,"rgba(14,10,12,1)",F.s*.008,.95);
  ctx.restore();
  restoreEye(EYE_SR,1);
  ctx.save(); local(); ctx.strokeStyle="rgba(12,10,12,.85)"; ctx.lineWidth=.022; ctx.lineJoin="round";
  ctx.beginPath(); shape(lid,ctx); ctx.stroke(); ctx.restore();
  ctx.save(); local();
  SPIDER_LEGS.forEach((l,i)=>{ if(!l[3]) return;
    const pl=legs[i], off=.042;
    for(let j=1;j<pl.length-1;j++){const a=pl[j-1],b=pl[j+1],dx=b.u-a.u,dy=b.v-a.v,n=Math.hypot(dx,dy)||1;
      let nx=-dy/n,ny=dx/n; const cu=pl[j].u-E.u,cvv=pl[j].v-E.v; if(nx*cu+ny*cvv<0){nx=-nx;ny=-ny}
      crystal(pl[j].u+nx*off,pl[j].v+ny*off,.02-j*.0006)}
  });
  ctx.restore();
}

/* Devil — small glossy horns, and a tail rising from the bottom of the frame */
function hornGrad(c,x0,x1){const g=c.createLinearGradient(x0,0,x1,0);
  g.addColorStop(0,"#8f1712");g.addColorStop(.35,"#d52b22");g.addColorStop(.7,"#b81e18");g.addColorStop(1,"#6e110d");return g}
function horn(u,v,side){

  ctx.save(); ctx.globalAlpha=.35; const sh=ctx.createRadialGradient(0,.02,0,0,.02,.26);
  sh.addColorStop(0,"rgba(0,0,0,.9)"); sh.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=sh;
  ctx.beginPath(); ctx.ellipse(0,.02,.26,.08,0,0,7); ctx.fill(); ctx.restore();
  const p=()=>{ctx.beginPath();ctx.moveTo(-.16,0);ctx.bezierCurveTo(-.2,-.2,-.12,-.42,.1,-.56);
    ctx.bezierCurveTo(.06,-.4,.16,-.18,.16,0);ctx.quadraticCurveTo(0,.05,-.16,0);ctx.closePath()};
  p(); ctx.fillStyle=hornGrad(ctx,-.18,.18); ctx.fill();
  ctx.save(); p(); ctx.clip();

  ctx.fillStyle=b; ctx.fillRect(-.3,-.6,.6,.7);
  ctx.strokeStyle="rgba(255,235,230,.75)"; ctx.lineWidth=.035; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-.09,-.06); ctx.bezierCurveTo(-.12,-.2,-.07,-.34,.04,-.45); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=.016;
  ctx.beginPath(); ctx.moveTo(-.08,-.12); ctx.bezierCurveTo(-.1,-.22,-.06,-.3,0,-.37); ctx.stroke();
  ctx.restore(); ctx.restore();
}
let tailX=null;
function tail(t){
  const right=!TGT||TGT.x<W/2, want=right?W*.93:W*.07;
  tailX=tailX==null?want:tailX+(want-tailX)*.06;
  const sw=Math.sin(t/650), s2=Math.sin(t/410+1), x0=tailX, h=H, d=tailX>W/2?1:-1;
  const B=[[x0,h*1.04],[x0+d*W*.02*sw,h*.8],[x0-d*W*.07-d*W*.015*s2,h*.64],[x0-d*W*.01+d*W*.025*sw,h*.52]];
  const bz=(k,i)=>{const a=1-k;return a*a*a*B[0][i]+3*a*a*k*B[1][i]+3*a*k*k*B[2][i]+k*k*k*B[3][i]};
  const N=48,L1=[],R1=[],C=[];
  for(let i=0;i<=N;i++){const k=i/N,x=bz(k,0),y=bz(k,1),e=.002,dx=bz(Math.min(1,k+e),0)-bz(Math.max(0,k-e),0),dy=bz(Math.min(1,k+e),1)-bz(Math.max(0,k-e),1),n=Math.hypot(dx,dy)||1;
    const th=h*(.026*(1-k)+.008), nx=-dy/n, ny=dx/n; L1.push([x+nx*th,y+ny*th]); R1.push([x-nx*th,y-ny*th]); C.push([x,y,nx,ny,th])}
  ctx.save(); screen();
  ctx.shadowColor="rgba(40,0,0,.35)"; ctx.shadowBlur=h*.02;
  ctx.beginPath(); ctx.moveTo(...L1[0]); L1.forEach(p=>ctx.lineTo(...p)); R1.slice().reverse().forEach(p=>ctx.lineTo(...p)); ctx.closePath();
  const g=ctx.createLinearGradient(x0-W*.09,0,x0+W*.09,0); g.addColorStop(0,"#8f1712");g.addColorStop(.45,"#cf271f");g.addColorStop(1,"#7a130e");
  ctx.fillStyle=g; ctx.fill(); ctx.shadowColor="transparent";
  ctx.strokeStyle="rgba(255,230,225,.55)"; ctx.lineCap="round"; ctx.lineWidth=h*.006;
  ctx.beginPath(); C.forEach(([x,y,nx,ny,th],i)=>{const px=x+nx*th*.45,py=y+ny*th*.45;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}); ctx.stroke();
  const [ex,ey]=[B[3][0],B[3][1]], tx=B[3][0]-B[2][0], ty=B[3][1]-B[2][1];
  ctx.translate(ex,ey); ctx.rotate(Math.atan2(ty,tx)+Math.PI/2); const z=h*.055; ctx.scale(z,z);
  ctx.beginPath(); ctx.moveTo(0,-1.25); ctx.bezierCurveTo(.35,-.9,1,-.4,.7,.05); ctx.quadraticCurveTo(.35,.25,0,-.05);
  ctx.quadraticCurveTo(-.35,.25,-.7,.05); ctx.bezierCurveTo(-1,-.4,-.35,-.9,0,-1.25); ctx.closePath();
  ctx.shadowColor="rgba(40,0,0,.35)"; ctx.shadowBlur=h*.015; ctx.fillStyle=hornGrad(ctx,-.8,.8); ctx.fill(); ctx.shadowColor="transparent";
  ctx.strokeStyle="rgba(255,240,235,.8)"; ctx.lineWidth=.08; ctx.beginPath(); ctx.moveTo(-.12,-1.0); ctx.quadraticCurveTo(-.55,-.55,-.5,-.1); ctx.stroke();
  ctx.restore();
}
function fxDevil(t,A){const top=A.top,lift=top.v-.24;horn(top.u-.7,lift,-1);horn(top.u+.7,lift,1)}

/* Birthday — editable text stacked into a little hat */
function hatRows(text){
  const tx=(text||"").trim()||"HBD", rows=[["^",...tx,"^"]];
  for(let w=rows[0].length-2;w>=1;w-=2){if(w===1){rows.push(["^"]);break}
    const r=Array(w).fill(" ");r[0]="^";r[w-1]="^";r[(w-1)>>1]="*";rows.push(r)}
  return rows;
}
function fxBirthday(t,A){
  const rows=hatRows($("hbdText").value), top=A.top, n=rows[0].length, size=Math.min(.4,3.4/n), step=size*.62, R=1.6;
  ctx.save(); local(); ctx.translate(top.u,top.v-.62+Math.sin(t/520)*.025);
  ctx.font=`400 ${size}px "Courier Prime", "Courier New", ui-monospace, monospace`; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  for(const pass of [0,1]){
    rows.forEach((row,ri)=>{const y=-ri*size*.82;row.forEach((ch,ci)=>{if(ch===" ")return;
      const x=(ci-(row.length-1)/2)*step,a=x/R;ctx.save();ctx.translate(Math.sin(a)*R,y+R-Math.cos(a)*R);ctx.rotate(a);
      if(!pass){ctx.shadowColor="rgba(255,250,235,.95)";ctx.shadowBlur=F.s*.09;ctx.fillStyle="rgba(255,255,255,.6)"}
      else{ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=F.s*.015;ctx.fillStyle="#fdfdfb"}
      ctx.fillText(ch,0,0);ctx.restore()})});
  }
  ctx.restore();
}

function fxCrybaby(t){
  const wob=Math.sin(t/180)*.04;
  const put=(im,eye,ax,ay,w,rot)=>{if(!im.complete||!im.naturalWidth)return;const p=L(eye);const h=w*im.height/im.width;
    ctx.save();local();ctx.translate(p.u,p.v+.06);ctx.rotate(rot);ctx.drawImage(im,-ax*w,-ay*h,w,h);ctx.restore()};
  put(TEAR_IMG.L,263,.97,.1,1.45,.05+wob);
  put(TEAR_IMG.R,33,.03,.42,1.35,-.05-wob);
}

/* ======================= SEGMENTATION ======================= */
const SW=256, SH=144;
const segIn=mk(SW,SH), segInCtx=segIn.getContext("2d");
const maskSmall=mk(SW,SH), msCtx=maskSmall.getContext("2d"), maskImg=msCtx.createImageData(SW,SH);
const maskFull=mk(), mfCtx=maskFull.getContext("2d");
let maskArr=new Float32Array(SW*SH), maskAt=0;
const needsSeg=()=>S.filter==="wall";
function runSeg(t){
  segInCtx.drawImage(vid,0,0,SW,SH);
  models.seg.segmentForVideo(segIn,ts(),res=>{
    const m=res.confidenceMasks&&res.confidenceMasks[0]; if(!m) return;
    const a=m.getAsFloat32Array(); if(a.length===maskArr.length) maskArr.set(a);
    const d=maskImg.data; for(let i=0;i<a.length;i++){d[i*4]=255;d[i*4+1]=255;d[i*4+2]=255;d[i*4+3]=a[i]*255}
    msCtx.putImageData(maskImg,0,0); maskAt=t;
  });
  if(maskFull.width!==W||maskFull.height!==H){maskFull.width=W;maskFull.height=H}
  mfCtx.setTransform(MIR?-1:1,0,0,1,MIR?W:0,0); mfCtx.clearRect(0,0,W,H); mfCtx.imageSmoothingEnabled=true; mfCtx.drawImage(maskSmall,0,0,W,H); mfCtx.setTransform(1,0,0,1,0,0);
}
let segSeq=0;
const maskReady=()=>maskAt>0&&performance.now()-maskAt<2500;

/* Sewn Wall — fabric letters sewn onto the wall behind you */
function pat(kind,u){
  const c=mk(u*2,u*2),g=c.getContext("2d");
  const fills={gingOrange:["#f8c48f","#e8772a"],gingPurple:["#c7b2e0","#7d5aa6"],plaid:["#3a3340","#e8772a"]};
  if(fills[kind]){const [a,b]=fills[kind];g.fillStyle="#fbf6f2";g.fillRect(0,0,u*2,u*2);g.globalAlpha=.75;g.fillStyle=a;g.fillRect(0,0,u,u*2);g.fillRect(0,0,u*2,u);
    g.fillStyle=b;g.fillRect(0,0,u,u);g.globalAlpha=.25;g.fillStyle="#fff";for(let i=0;i<u*2;i+=3)g.fillRect(i,0,1,u*2);}
  else if(kind==="dots"){g.fillStyle="#6b4a8f";g.fillRect(0,0,u*2,u*2);g.fillStyle="#ffb15c";[[.5,.5],[1.5,1.5]].forEach(([x,y])=>{g.beginPath();g.arc(x*u,y*u,u*.22,0,7);g.fill()})}
  else if(kind==="felt"){g.fillStyle="#2b2430";g.fillRect(0,0,u*2,u*2);const r=rng(3);for(let i=0;i<u*6;i++){g.fillStyle=r()<.5?"rgba(255,255,255,.18)":"rgba(232,119,42,.25)";g.fillRect(r()*u*2,r()*u*2,1.5,1.5)}}
  else if(kind==="web"){g.fillStyle="#f3ece0";g.fillRect(0,0,u*2,u*2);g.strokeStyle="rgba(40,32,45,.55)";g.lineWidth=1;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;g.beginPath();g.moveTo(u,u);g.lineTo(u+Math.cos(a)*u*1.5,u+Math.sin(a)*u*1.5);g.stroke()}
    for(const rr2 of [.35,.7,1.0]){g.beginPath();for(let i=0;i<=8;i++){const a=i*Math.PI/4,x=u+Math.cos(a)*u*rr2,y=u+Math.sin(a)*u*rr2;i?g.quadraticCurveTo(u+Math.cos(a-Math.PI/8)*u*rr2*.8,u+Math.sin(a-Math.PI/8)*u*rr2*.8,x,y):g.moveTo(x,y)}g.stroke()}}
  return c;
}
function button(g,x,y,r,col){
  g.save();g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=r*.4;g.shadowOffsetY=r*.15;
  g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowColor="transparent";
  g.strokeStyle="rgba(0,0,0,.18)";g.lineWidth=r*.12;g.beginPath();g.arc(x,y,r*.72,0,7);g.stroke();
  g.fillStyle="rgba(255,255,255,.35)";g.beginPath();g.arc(x-r*.35,y-r*.4,r*.3,0,7);g.fill();
  g.fillStyle="rgba(60,20,30,.55)";[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{g.beginPath();g.arc(x+a*r*.22,y+b*r*.22,r*.1,0,7);g.fill()});
  g.restore();
}
function starStud(g,x,y,r,rot){

  const dt=Math.min(.1,(t-(prevT||t))/1000); prevT=t;

  ACTIVE=FACES.filter(fc=>t-fc.seen<400); const has=ACTIVE.length>0; let prim=null;
  for(const fc of ACTIVE){P=fc.P;buildFrame();fc.F=F;if(!prim||F.s>prim.F.s)prim=fc}
  if(prim){P=prim.P;F=prim.F}
  const pets=t-petAt<1000?PETS:[];
  if(has){let sx=0,sy=0,x0=1e9,x1=-1e9;ACTIVE.forEach(fc=>{sx+=fc.F.ox;sy+=fc.F.oy;x0=Math.min(x0,fc.F.ox);x1=Math.max(x1,fc.F.ox)});
    TGT={x:sx/ACTIVE.length,y:sy/ACTIVE.length,s:F.s,spread:x1-x0}}
  else TGT=pets[0]?{x:pets[0].ox,y:pets[0].oy,s:pets[0].s,spread:0}:null;
  if(has&&beautyOn()){warpFrame();bctx.setTransform(1,0,0,1,0,0);bctx.drawImage(glc,0,0)}
  else{bctx.setTransform(MIR?-1:1,0,0,1,MIR?W:0,0);bctx.drawImage(vid,0,0,W,H);bctx.setTransform(1,0,0,1,0,0)}
  if(S.bw){bctx.save();bctx.globalCompositeOperation="saturation";bctx.fillStyle="#808080";bctx.fillRect(0,0,W,H);bctx.restore()}
  screen(); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; ctx.drawImage(base,0,0);
  if(S.filter==="wall") fxWall();
  else {
    if(has&&RUN[S.filter]){for(const fc of ACTIVE){P=fc.P;F=fc.F;CUR=fc;ctx.save();RUN[S.filter](t,{top:fitTop(L(10),S.filter),le:L(454),re:L(234)});ctx.restore();screen()}P=prim.P;F=prim.F}
    if(PET_RUN[S.filter]&&pets.length){const keep=F;for(const p of pets){petFrame(p);ctx.save();PET_RUN[S.filter](t,petA());ctx.restore();screen()}F=keep}
  }
  if(S.filter==="ghosts") fingerGhosts(t);
  if(S.filter==="devil") tail(t);
  if(S.mosaic) mosaic(t);
  screen();
  if(S.lens==="booth") lensBooth(t);
  else if(S.lens==="locked") lensLocked(t,has,dt);
  else if(S.lens==="pixel") lensPixel(has);
  else out.drawImage(scene,0,0);
  { const lbl=$("shot").textContent, sl=$("shutterLabel"), want=lbl==="Capture"?"":lbl==="Save strip"?"Save":lbl.startsWith("Shooting")?"…":lbl.replace("Shoot ",""); if(sl.textContent!==want) sl.textContent=want; }
  let st;
  if(!models.face) st="Loading face tracking";
  else if(needsSeg()&&!models.seg) st="Loading body tracking";
  else if(S.mosaic&&!models.hand) st="Loading hand tracking";
  else if(!has&&!pets.length&&!needsSeg()&&S.filter!=="none") st="Looking for a face or pet";
  else if(!has&&pets.length&&!needsSeg()) st=(PET_RUN[S.filter]||S.filter==="none"?FILTERS.find(f=>f[0]===S.filter)[1]:"Face-only filter")+" · "+pets.map(p=>p.kind).join(", ");
  else if(S.filter==="ghosts"&&!models.hand) st="Loading hand tracking";
  else st=HINT[S.filter]||FILTERS.find(f=>f[0]===S.filter)[1];
  setStatus(st,has||pets.length>0||needsSeg());
}

/* ======================= START ======================= */
async function getFileset(){if(!fileset)fileset=await FilesetResolver.forVisionTasks(CDN);return fileset}
async function make(Cls,opts){const fs=await getFileset();
  try{return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:"GPU"}})}
  catch{return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:"CPU"}})}}
function loadHand(){if(loading.hand)return;loading.hand=true;make(HandLandmarker,{baseOptions:{modelAssetPath:MODEL.hand},runningMode:"VIDEO",numHands:MOBILE?2:4}).then(m=>models.hand=m).catch(()=>setStatus("Hand tracking failed to load"))}
function loadSeg(){if(loading.seg)return;loading.seg=true;make(ImageSegmenter,{baseOptions:{modelAssetPath:MODEL.seg},runningMode:"VIDEO",outputConfidenceMasks:true,outputCategoryMask:false}).then(m=>models.seg=m).catch(()=>setStatus("Body tracking failed to load"))}
async function openCamera(facing){
  if(vid.srcObject) vid.srcObject.getTracks().forEach(tr=>tr.stop());
  const portrait=innerHeight>innerWidth;
  const size=MOBILE?(portrait?{width:{ideal:720},height:{ideal:960},aspectRatio:{ideal:3/4}}:{width:{ideal:960},height:{ideal:720},aspectRatio:{ideal:4/3}}):{width:{ideal:1280},height:{ideal:720}};
  const stream=await navigator.mediaDevices.getUserMedia({video:{...size,facingMode:facing},audio:false});
  vid.srcObject=stream; await vid.play();
  FACING=facing; MIR=facing==="user";
  W=vid.videoWidth; H=vid.videoHeight; for(const c of [base,scene]){c.width=W;c.height=H}
  FACES.length=0; DRIPS.length=0; P=null; BG_CACHE_RESET(); sizeOut();
}
async function flipCamera(){
  const b=$("flipBtn"); b.disabled=true;
  try{await openCamera(FACING==="user"?"environment":"user")}catch(e){try{await openCamera(FACING)}catch(_){}}
  b.disabled=false;
}
async function start(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("insecure");
    await openCamera("user");
    hint.hidden=true; $("shot").disabled=false; $("shutter").disabled=false;
    if(MOBILE){$("lens").hidden=true;$("lensSep").hidden=true;pickLens("booth")}
    navigator.mediaDevices.enumerateDevices().then(ds=>{if(ds.filter(d=>d.kind==="videoinput").length>1)$("flipBtn").hidden=false}).catch(()=>{});
    Promise.all(['700 40px "Courier Prime"','400 40px "Courier Prime"','700 40px Fredoka','600 40px Fredoka','40px Pacifico'].map(f=>document.fonts.load(f))).then(()=>{fontsReady=true;PIX.body=null}).catch(()=>{});
    requestAnimationFrame(frame);
  }catch(e){hint.textContent=!window.isSecureContext&&location.protocol!=="file:"?"The camera only works on an https:// link. Open this page from an https address.":"Camera is blocked. Allow camera access in the browser settings, then reload.";setStatus("No camera");return}
  make(ObjectDetector,{baseOptions:{modelAssetPath:MODEL.pet},runningMode:"VIDEO",scoreThreshold:.4,maxResults:3,categoryAllowlist:["cat","dog"]}).then(m=>models.pet=m).catch(()=>{});
  try{models.face=await make(FaceLandmarker,{baseOptions:{modelAssetPath:MODEL.face},runningMode:"VIDEO",numFaces:MOBILE?2:4,outputFaceBlendshapes:true})}
  catch(e){setStatus("Face tracking failed to load. Check the connection and reload.")}
}
start();
